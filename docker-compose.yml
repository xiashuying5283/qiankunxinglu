version: '3.8'

services:
  divination:
    build: .
    container_name: divination-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # 应用域名（改为你的实际域名）
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:5000}
      # PostgreSQL 数据库配置
      - PGDATABASE_URL=${PGDATABASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      # JWT 密钥（生成一个随机字符串）
      - JWT_SECRET=${JWT_SECRET}
      # OpenAI API 配置
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      - OPENAI_MODEL=${OPENAI_MODEL:-doubao-seed-2-0-pro-260215}
      # OAuth 配置（可选）
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # 管理员用户 ID（逗号分隔）
      - ADMIN_USER_IDS=${ADMIN_USER_IDS}
      # ICP 备案号（可选）
      - ICP_BEIAN=${ICP_BEIAN}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
